<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信 海外視聴者マップ - わんコメ連携</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f8fafc; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #1e293b; color: white; }
    header h1 { margin: 0; font-size: 16px; }
    #status { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #475569; }
    #status.connected { background: #16a34a; }
    #main { display: flex; height: calc(100vh - 140px); }
    #map { flex: 1; height: 100%; }
    #sidebar { width: 320px; display: flex; flex-direction: column; border-left: 1px solid #e2e8f0; background: white; }
    #sidebar > div { flex: 1; overflow-y: auto; }
    .panel-header { padding: 10px 12px; font-weight: 700; border-bottom: 1px solid #e2e8f0; background: #f1f5f9; font-size: 13px; }
    #comments { padding: 8px; }
    .comment { display: flex; gap: 8px; padding: 6px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .comment img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .comment .meta { color: #64748b; font-size: 11px; }
    .comment .text { margin-top: 2px; word-break: break-word; }
    #viewer-list { padding: 8px; }
    .viewer-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .viewer-item:hover { background: #f8fafc; }
    .viewer-item.selected { background: #dbeafe; outline: 2px solid #2563eb; }
    .viewer-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .viewer-item .info { flex: 1; min-width: 0; }
    .viewer-item .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-item .country { font-size: 11px; color: #64748b; }
    .viewer-item .country.missing { color: #ef4444; }
    .viewer-item .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #fef3c7; color: #92400e; }
    footer { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: white; border-top: 1px solid #e2e8f0; flex-wrap: wrap; }
    footer input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    footer button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; font-size: 13px; }
    footer button.secondary { background: #64748b; }
    footer button.danger { background: #ef4444; }
    .hint { color: #64748b; font-size: 11px; }
    .leaflet-tooltip-country { background: rgba(255,255,255,0.92); border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,0.1); white-space: nowrap; }
    .leaflet-tooltip-country::before { display: none; }
    .country-label-text { padding: 0; border-radius: 0; font-size: 11px; color: #1e3a5f; background: transparent; border: none; white-space: nowrap; display: inline-block; text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 4px rgba(255,255,255,0.9), 1px 1px 2px rgba(0,0,0,0.3); font-weight: 600; }
    .country-label { background: transparent !important; border: none !important; box-shadow: none !important; }
    .city-label-text { padding: 0; border-radius: 0; font-size: 10px; color: #1e3a5f; background: transparent; border: none; white-space: nowrap; display: inline-block; text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 4px rgba(255,255,255,0.9), 1px 1px 2px rgba(0,0,0,0.3); }
    .city-label { background: transparent !important; border: none !important; box-shadow: none !important; }
    .city-marker-text { padding: 0; border-radius: 0; font-size: 10px; color: #1e3a5f; background: transparent; border: none; white-space: nowrap; display: inline-block; text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 4px rgba(255,255,255,0.9), 1px 1px 2px rgba(0,0,0,0.3); }
    .city-marker-label { background: transparent !important; border: none !important; box-shadow: none !important; }
    .place-label-text { padding: 0; border-radius: 0; font-size: 10px; color: #1e3a5f; background: transparent; border: none; white-space: nowrap; display: inline-block; text-shadow: 0 0 4px rgba(255,255,255,0.95), 0 0 4px rgba(255,255,255,0.95), 1px 1px 2px rgba(0,0,0,0.35); line-height: 1.35; }
    .place-label { background: transparent !important; border: none !important; box-shadow: none !important; }
    @media (max-width: 768px) {
      #main { flex-direction: column; height: auto; }
      #map { height: 50vh; }
      #sidebar { width: 100%; height: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>配信 海外視聴者マップ</h1>
    <span id="status">切断</span>
  </header>

  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <div>
        <div class="panel-header">コメントFeed (わんコメ)</div>
        <div id="comments"></div>
      </div>
      <div>
        <div class="panel-header">視聴者リスト</div>
        <div id="viewer-list"></div>
      </div>
    </div>
  </div>

  <footer>
    <input id="name" placeholder="名前" />
    <input id="country" placeholder="国名" style="width: 120px;" />
    <button id="save">ピンを保存</button>
    <button id="clear" class="secondary">全削除</button>
    <span class="hint">地図クリックでピン → 保存で記録 / わんコメから自動追加</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = '';
    let map, currentMarker = null, selectedViewerId = null;
    let viewers = [];
    let ws = null;
    const markerLayer = L.layerGroup();
    const comments = [];
    const MAX_COMMENTS = 50;
let countryMap = {};
let countryLabelLayer = null;
let cityLabelLayer = null;
let placeLabelLayer = null;
let adminLineLayer = null;
let prefectureMap = {};
let prefectureLabelLayer = null;
let countryBorderLayer = null;
const cityCache = {};
const placeCache = new Set();
const nominatimCache = {};
let placeQueryTimer = null;

    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 1,
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        touchZoom: true,
        boxZoom: false,
        keyboard: false,
        worldCopyJump: false,
        maxBounds: [[-90, -180], [90, 180]],
        maxBoundsViscosity: 1.0
      });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 10,
        noWrap: true,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      markerLayer.addTo(map);

      map.on('click', (e) => {
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = L.marker(e.latlng).addTo(map);
        if (selectedViewerId) {
          setViewerLocation(selectedViewerId, e.latlng.lat, e.latlng.lng, document.getElementById('country').value.trim());
        }
      });

      map.on('moveend', schedulePlaceUpdate);
      map.on('zoomend', schedulePlaceUpdate);
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      const statusEl = document.getElementById('status');

      ws.onopen = () => {
        statusEl.textContent = '接続済み';
        statusEl.classList.add('connected');
      };
      ws.onclose = () => {
        statusEl.textContent = '再接続中...';
        statusEl.classList.remove('connected');
        setTimeout(connectWebSocket, 3000);
      };
      ws.onerror = () => {
        statusEl.textContent = 'エラー';
      };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        switch (data.type) {
          case 'init':
            viewers = data.viewers || [];
            renderViewers();
            renderMarkers();
            break;
          case 'update':
            const idx = viewers.findIndex(v => v.id === data.viewer.id);
            if (idx >= 0) viewers[idx] = data.viewer;
            else viewers.push(data.viewer);
            renderViewers();
            renderMarkers();
            addComment(data.viewer.name, data.viewer.icon, data.viewer.comments?.[data.viewer.comments.length - 1]?.text || '');
            break;
          case 'delete':
            viewers = viewers.filter(v => v.id !== data.id);
            renderViewers();
            renderMarkers();
            break;
          case 'clear':
            viewers = [];
            renderViewers();
            renderMarkers();
            break;
        }
      };
    }

    async function loadViewers() {
      try {
        const res = await fetch(`${API_BASE}/api/viewers`);
        viewers = await res.json();
        renderViewers();
        renderMarkers();
        for (const v of viewers) {
          if (!v.city && v.lat != null && v.lng != null) {
            const city = await lookupCity(v.lat, v.lng);
            if (city) {
              await fetch(`${API_BASE}/api/viewers/${v.id}/location`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ city: { en: city, ja: city } })
              });
            }
          }
        }
      } catch (e) {
        console.error('Failed to load viewers:', e);
      }
    }

    function renderMarkers() {
      markerLayer.clearLayers();
      viewers.forEach((v) => {
        if (v.lat != null && v.lng != null) {
          const m = L.marker([v.lat, v.lng]).addTo(markerLayer);
          const iconHtml = v.icon ? `<img src="${escapeHtml(v.icon)}" style="width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:6px;" onerror="this.style.display='none'" />` : '';
          const countryLabel = getCountryLabel(v.country);
          m.bindPopup(`<div style="min-width:150px;">${iconHtml}<b>${escapeHtml(v.name)}</b><br/><span style="color:#64748b;font-size:12px;">${countryLabel}</span><br/><span style="color:#94a3b8;font-size:11px;">${escapeHtml(v.lastSeen || '')}</span></div>`);
          if (v.country) {
            m.bindTooltip(countryLabel, {
              permanent: true,
              direction: 'top',
              className: 'leaflet-tooltip-country',
              offset: [0, -10]
            });
          }
          if (v.city) {
            const cityLabel = `${v.city.en || v.city} / ${v.city.ja || v.city}`;
            L.marker([v.lat, v.lng], {
              icon: L.divIcon({
                className: 'city-marker-label',
                html: `<span class="city-marker-text">${escapeHtml(cityLabel)}</span>`,
                iconSize: [120, 18],
                iconAnchor: [60, 30]
              }),
              interactive: false
            }).addTo(markerLayer);
          }
        }
      });
    }

    function renderViewers() {
      const container = document.getElementById('viewer-list');
      if (!viewers.length) {
        container.innerHTML = '<p style="color:#94a3b8;font-size:13px;padding:8px;">視聴者がいません。</p>';
        return;
      }
      container.innerHTML = viewers.map((v) => {
        const isSelected = v.id === selectedViewerId;
        const countryLabel = getCountryLabel(v.country);
        const countryClass = v.country ? '' : 'missing';
        const cityText = v.city ? (v.city.ja || v.city.en || v.city) : '';
        const iconHtml = v.icon ? `<img src="${escapeHtml(v.icon)}" onerror="this.style.display='none'" />` : '<div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b;">?</div>';
        return `<div class="viewer-item ${isSelected ? 'selected' : ''}" data-id="${v.id}">
          ${iconHtml}
          <div class="info">
            <div class="name">${escapeHtml(v.name)}</div>
            <div class="country ${countryClass}">${escapeHtml(countryLabel)}${cityText ? ' · ' + escapeHtml(cityText) : ''}</div>
          </div>
          ${!v.country ? '<span class="badge">要設定</span>' : ''}
          <button class="danger" data-del="${v.id}" style="padding:4px 8px;font-size:11px;">削除</button>
        </div>`;
      }).join('');

      container.querySelectorAll('.viewer-item').forEach((el) => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          selectedViewerId = el.dataset.id;
          renderViewers();
        });
      });
      container.querySelectorAll('button[data-del]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('削除しますか？')) return;
          await fetch(`${API_BASE}/api/viewers/${btn.dataset.del}`, { method: 'DELETE' });
          if (selectedViewerId === btn.dataset.del) selectedViewerId = null;
          loadViewers();
        });
      });
    }

    async function lookupCity(lat, lng) {
      const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
      if (cityCache[key]) return cityCache[key];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=en,ja&zoom=10`);
        if (!res.ok) return null;
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.county || null;
        if (city) {
          cityCache[key] = city;
          return city;
        }
      } catch (e) {
        console.error('Failed to lookup city:', e);
      }
      return null;
    }

    async function fetchPlacesInBounds() {
      const bounds = map.getBounds();
      const south = bounds.getSouth();
      const west = bounds.getWest();
      const north = bounds.getNorth();
      const east = bounds.getEast();
      const cacheKey = `adm4_${south.toFixed(1)},${west.toFixed(1)},${north.toFixed(1)},${east.toFixed(1)},${map.getZoom()}`;
      if (placeCache.has(cacheKey)) return;
      placeCache.add(cacheKey);
      try {
        const query = `[out:json];relation["boundary"="administrative"]["admin_level"="4"](${south},${west},${north},${east});out center;`;
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        if (!res.ok) return;
        const data = await res.json();
        const places = [];
        data.elements.forEach((el) => {
          const tags = el.tags || {};
          const name = tags.name || tags['name:en'] || tags['name:ja'] || null;
          const nameEn = tags['name:en'] || null;
          const nameJa = tags['name:ja'] || null;
          if (name && el.center && el.center.lat && el.center.lon) {
            places.push({ lat: el.center.lat, lon: el.center.lon, name, nameEn, nameJa, place: 'admin', id: el.id });
          }
        });
        renderPlaceLabels(places);
        await fillMissingEnglishNames(places);
      } catch (e) {
        console.error('Failed to fetch places:', e);
      }
    }

    async function fillMissingEnglishNames(places) {
      const missing = places.filter(p => !p.nameEn);
      if (!missing.length) return;
      for (const place of missing) {
        const cacheKey = `${place.lat.toFixed(2)},${place.lon.toFixed(2)}`;
        if (nominatimCache[cacheKey]) {
          place.nameEn = nominatimCache[cacheKey];
          renderPlaceLabels(places);
          continue;
        }
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${place.lat}&lon=${place.lon}&accept-language=en&zoom=10`);
          if (res.ok) {
            const data = await res.json();
            const enName = data.address?.state || data.address?.county || data.address?.region || data.address?.province || null;
            if (enName) {
              nominatimCache[cacheKey] = enName;
              place.nameEn = enName;
              renderPlaceLabels(places);
            }
          }
        } catch (e) {
          console.error('Nominatim fallback failed:', e);
        }
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    function renderPlaceLabels(places) {
      if (placeLabelLayer) {
        map.removeLayer(placeLabelLayer);
      }
      placeLabelLayer = L.layerGroup();
      const zoom = map.getZoom();
      places.forEach((p) => {
        if (p.place !== 'admin') return;
        if (zoom < 2) return;
        const localName = p.name || '';
        const enName = p.nameEn || '';
        const jaName = p.nameJa || '';
        if (!localName && !enName && !jaName) return;
        const marker = L.marker([p.lat, p.lon], {
          icon: L.divIcon({
            className: 'place-label',
            html: `<span class="place-label-text">${escapeHtml(localName)}${jaName && jaName !== localName ? '<br>' + escapeHtml(jaName) : ''}${enName && enName !== localName && enName !== jaName ? '<br>' + escapeHtml(enName) : ''}</span>`,
            iconSize: [120, 40],
            iconAnchor: [60, 20]
          }),
          interactive: false
        });
        placeLabelLayer.addLayer(marker);
      });
      placeLabelLayer.addTo(map);
    }

    async function fetchAdminLines() {
      const bounds = map.getBounds();
      const south = bounds.getSouth();
      const west = bounds.getWest();
      const north = bounds.getNorth();
      const east = bounds.getEast();
      const cacheKey = `adm4_lines_${south.toFixed(1)},${west.toFixed(1)},${north.toFixed(1)},${east.toFixed(1)},${map.getZoom()}`;
      if (placeCache.has(cacheKey)) return;
      placeCache.add(cacheKey);
      try {
        const query = `[out:json][timeout:25];way["boundary"="administrative"]["admin_level"="4"](${south},${west},${north},${east});out body;>;out skel qt;`;
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        if (!res.ok) return;
        const data = await res.json();
        const nodes = {};
        const ways = [];
        data.elements.forEach((el) => {
          if (el.type === 'node') {
            nodes[el.id] = [el.lat, el.lon];
          } else if (el.type === 'way' && el.nodes && el.nodes.length > 1) {
            ways.push(el);
          }
        });
        renderAdminLines(ways, nodes);
      } catch (e) {
        console.error('Failed to fetch admin lines:', e);
      }
    }

    function renderAdminLines(ways, nodes) {
      if (adminLineLayer) {
        map.removeLayer(adminLineLayer);
      }
      adminLineLayer = L.layerGroup();
      ways.forEach((way) => {
        const latlngs = way.nodes.map((nid) => nodes[nid]).filter(Boolean);
        if (latlngs.length > 1) {
          L.polyline(latlngs, {
            color: '#64748b',
            weight: 1.2,
            opacity: 0.7,
            interactive: false
          }).addTo(adminLineLayer);
        }
      });
      adminLineLayer.addTo(map);
    }

    function schedulePlaceUpdate() {
      if (placeQueryTimer) clearTimeout(placeQueryTimer);
      placeQueryTimer = setTimeout(() => {
        fetchPlacesInBounds();
        fetchAdminLines();
      }, 500);
    }

    async function setViewerLocation(id, lat, lng, country) {
      const city = await lookupCity(lat, lng);
      await fetch(`${API_BASE}/api/viewers/${id}/location`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat, lng, country, city })
      });
      loadViewers();
    }

    document.getElementById('save').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const country = document.getElementById('country').value.trim();
      if (!currentMarker) return alert('まず地図で場所を選択してください。');
      const latlng = currentMarker.getLatLng();
      const city = await lookupCity(latlng.lat, latlng.lng);
      await fetch(`${API_BASE}/api/viewers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || 'Unknown', country, lat: latlng.lat, lng: latlng.lng, city })
      });
      document.getElementById('name').value = '';
      document.getElementById('country').value = '';
      if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
      loadViewers();
    });

    document.getElementById('clear').addEventListener('click', async () => {
      if (!confirm('全ての記録を削除しますか？')) return;
      await fetch(`${API_BASE}/api/viewers`, { method: 'DELETE' });
      selectedViewerId = null;
      loadViewers();
    });

    function addComment(name, icon, text) {
      const container = document.getElementById('comments');
      const time = new Date().toLocaleTimeString('ja-JP');
      const iconHtml = icon ? `<img src="${escapeHtml(icon)}" onerror="this.style.display='none'" />` : '';
      const div = document.createElement('div');
      div.className = 'comment';
      div.innerHTML = `${iconHtml}<div><div class="meta">${escapeHtml(name)} · ${time}</div><div class="text">${escapeHtml(text)}</div></div>`;
      container.insertBefore(div, container.firstChild);
      while (container.children.length > MAX_COMMENTS) container.removeChild(container.lastChild);
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function getCountryLabel(raw) {
      if (!raw) return '国未設定';
      const key = String(raw).trim().toUpperCase();
      const direct = countryMap[key];
      if (direct) {
        if (direct.native && direct.native !== direct.en) {
          return `${direct.native} / ${direct.en} / ${direct.ja}`;
        }
        return `${direct.en} / ${direct.ja}`;
      }
      const upper = String(raw).trim().toUpperCase();
      const found = Object.entries(countryMap).find(([, v]) => {
        return [v.native, v.en, v.ja].some((n) => String(n).trim().toUpperCase() === upper);
      });
      if (found) {
        const data = found[1];
        if (data.native && data.native !== data.en) {
          return `${data.native} / ${data.en} / ${data.ja}`;
        }
        return `${data.en} / ${data.ja}`;
      }
      return raw;
    }

    async function loadCountryData() {
      try {
        const [countryRes, cityRes, prefRes] = await Promise.all([
          fetch(`${API_BASE}/countries.json`),
          fetch(`${API_BASE}/cities.json`),
          fetch(`${API_BASE}/prefectures.json`)
        ]);
        if (countryRes.ok) countryMap = await countryRes.json();
        if (cityRes.ok) {
          const cities = await cityRes.json();
          renderCountryLabels();
          renderCityLabels(cities);
        }
        if (prefRes.ok) {
          prefectureMap = await prefRes.json();
          renderPrefectureLabels();
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
    }

    async function loadCountryBorders() {
      try {
        const res = await fetch(`${API_BASE}/countries.geojson`);
        if (!res.ok) return;
        const geojson = await res.json();
        if (countryBorderLayer) {
          map.removeLayer(countryBorderLayer);
        }
        countryBorderLayer = L.geoJSON(geojson, {
          style: {
            color: '#1e293b',
            weight: 1.5,
            opacity: 0.8,
            fillColor: 'transparent',
            fillOpacity: 0
          }
        }).addTo(map);
      } catch (e) {
        console.error('Failed to load country borders:', e);
      }
    }

    function renderCountryLabels() {
      if (countryLabelLayer) {
        map.removeLayer(countryLabelLayer);
      }
      countryLabelLayer = L.layerGroup();
      Object.entries(countryMap).forEach(([code, data]) => {
        if (data.lat != null && data.lng != null) {
          const label = getCountryLabel(code);
          const marker = L.marker([data.lat, data.lng], {
            icon: L.divIcon({
              className: 'country-label',
              html: `<span class="country-label-text">${escapeHtml(label)}</span>`,
              iconSize: [120, 20],
              iconAnchor: [60, 10]
            }),
            interactive: false
          });
          countryLabelLayer.addLayer(marker);
        }
      });
      countryLabelLayer.addTo(map);
    }

    function renderPrefectureLabels() {
      if (prefectureLabelLayer) {
        map.removeLayer(prefectureLabelLayer);
      }
      prefectureLabelLayer = L.layerGroup();
      Object.entries(prefectureMap).forEach(([code, data]) => {
        if (data.lat != null && data.lng != null) {
          const label = `${data.en} / ${data.ja}`;
          const marker = L.marker([data.lat, data.lng], {
            icon: L.divIcon({
              className: 'country-label',
              html: `<span class="country-label-text">${escapeHtml(label)}</span>`,
              iconSize: [120, 20],
              iconAnchor: [60, 10]
            }),
            interactive: false
          });
          prefectureLabelLayer.addLayer(marker);
        }
      });
      prefectureLabelLayer.addTo(map);
    }

    function renderCityLabels(cities) {
      if (cityLabelLayer) {
        map.removeLayer(cityLabelLayer);
      }
      cityLabelLayer = L.layerGroup();
      Object.entries(cities).forEach(([code, data]) => {
        if (data.lat != null && data.lng != null) {
          const label = `${data.en} / ${data.ja}`;
          const marker = L.marker([data.lat, data.lng], {
            icon: L.divIcon({
              className: 'city-label',
              html: `<span class="city-label-text">${escapeHtml(label)}</span>`,
              iconSize: [100, 18],
              iconAnchor: [50, 9]
            }),
            interactive: false
          });
          cityLabelLayer.addLayer(marker);
        }
      });
      cityLabelLayer.addTo(map);
    }

    initMap();
    loadCountryData();
    loadCountryBorders();
    fetchPlacesInBounds();
    connectWebSocket();
    loadViewers();
  </script>
</body>
</html>
